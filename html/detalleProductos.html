<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="/css/login.css">
    <link rel="stylesheet" href="/css/productos.css">
    <script src="/js/productosTienda.js"></script>

    <title>Producto</title>
</head>
<body>

    <nav class="navbar navbar-expand-lg bg-body-tertiary">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">Fronentes</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarSupportedContent">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                <li class="nav-item">
                <a class="nav-link active" aria-current="page" href="#">Home</a>
                </li>
            </ul>
            </div>
        </div>
    </nav>
    
    <main class="container">

        <div class="container_presentacion"> <!-- Apertura carta de presentación -->
            <div class="card_productos"> 
                <h1></h1>
                <img src="" class="card_productos_img" alt="producto-detalle">
            </div> 
            <div class="card_precios">
                <div class="card_precios_detalles">
                    <p>Precio neto: $<span id="precioProducto"></span></p>
                    <p>IVA (19%): $<span id="precioIVA"></span></p>
                    <Strong><p>Precio TOTAL: $<span id="precioTotal"></span></p></Strong>
                </div>
                <button type="button" class="btn btn-info btn-lg btn-carrito">Agregar al carrito</button>
            </div>
        </div> <!-- Cierre carta de presentación -->
        

        <div class="accordion" id="accordionPanelsStayOpenExample"> <!-- Comienzo de acordeon -->
            <div class="accordion-item">
                <h2 class="accordion-header">
                    <button class="accordion-button" type="button" data-bs-toggle="collapse" data-bs-target="#panelsStayOpen-collapseOne" aria-expanded="true" aria-controls="panelsStayOpen-collapseOne">
                        Descripción del producto
                    </button>
                </h2>
                <div id="panelsStayOpen-collapseOne" class="accordion-collapse collapse show">
                    <div class="accordion-body">
                        Proximamente descripciones del producto disponibles (en construccion)
                    </div>
                </div>
            </div>
            <div class="accordion-item">
                <h2 class="accordion-header">
                    <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#panelsStayOpen-collapseTwo" aria-expanded="false" aria-controls="panelsStayOpen-collapseTwo">
                        Características 
                    </button>
                </h2>
                <div id="panelsStayOpen-collapseTwo" class="accordion-collapse collapse">
                    <div class="accordion-body">
                        Caracteristica 1
                    </div>
                </div>
            </div>
        </div> <!-- Cierre de acordeon -->
        
    </main>
    
    <footer>
        <div>
            <p>Fronentes es una empresa ficticia enfocada en venta de hardware para PC</p>
        </div>
    </footer>

</body>
</html>
