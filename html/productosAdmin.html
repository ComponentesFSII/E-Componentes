<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="../js/productosAdmin.js" defer></script>
    <link rel="stylesheet" href="../css/registroProductos.css">
    <title>Productos - ADMI</title>
</head>
<body>
    <nav class="navbar bg-dark border-bottom border-body mb-3" data-bs-theme="dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">Navbar</a>
        </div>
    </nav>

    <table class="table">
        <thead>
            <tr>
            <th scope="col">#</th>
            <th scope="col">Producto</th>
            <th scope="col">Precio</th>
            <th scope="col">Imagen</th>
            </tr>
        </thead>
        <tbody id="table-products">
            <tr>
            <th scope="row">1</th>
                <td></td>
                <td></td>
                <td></td>
            </tr>
            <tr>
            <th scope="row">2</th>
                <td></td>
                <td></td>
                <td></td>
            </tr>
            <tr>
            <th scope="row">3</th>
                <td></td>
                <td></td>
                <td></td>
            </tr>
        </tbody>
    </table>

    <button class="btn btn-success" id="ventana-ingreso-productos">Agregar producto</button>

    <dialog id="cuadro-ingreso-productos">
        <form class="cuadro-registro"  id="forma-ingreso-productos">
            <h3>INGRESO DE PRODUCTOS</h3>
            <label for="ingreso-nombre">Nombre: </label>
            <input type="text" id="ingreso-nombre" required>
            
            <label for="ingreso-precio">Precio: </label>
            <input type="number" id="ingreso-precio" required>
            
            <label for="ingreso-imagen">Imagen: </label>
            <input type="text" id="ingreso-imagen" required>

            <div style="margin-top: 50px;">
                <button type="submit" class="btn btn-info">Agregar</button>
                <button type="button" class="btn btn-danger" id="btn-cerrar-cuadro">Cancelar</button>
            </div>
        </form>
    </dialog>

    <footer>
        <div>
            <p>Fronentes es una empresa ficticia enfocada en venta de hardware para PC</p>
        </div>
    </footer>

</body>
</html>
